[project]
name = "latent-sound-diffusion"
version = "0.7.0"
description = "Sound generation via ArrowSpace Latent Diffusion with Spectral Chart Conditioning (ALD-SC)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "encodec>=0.1.1",
    "ipykernel>=6.29.0",
    "ipython>=8.30.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pedalboard>=0.9.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22,<0.16",
    "scipy>=1.14.0",
    "soundfile>=0.13.1",
    "structlog>=26.1.0",
    "torch>=2.2",
    "torchaudio>=0.28.0",
    "torchvision>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ald_sc"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
